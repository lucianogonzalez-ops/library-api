# ──────────────────────────────────────────────────────────────
# Schemas: la forma de los datos. Tienen que coincidir con las
# tablas de la base y con las interfaces de src/types/.
# ──────────────────────────────────────────────────────────────
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Book not found
    
    Author:
      type: object
      required: [id,name,nationality]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Jorge Luis Borges
        nationality:
          type: string
          example: Argentinean

    Book:
      type: object
      required: [id,title,year,author_id,available]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example:  Harry Potter y la piedra filosofal,
        year:
          type: integer
          example: 1997
        author_id:
          type: integer
          example: 1
        available :
          type: boolean
          example : false





    
    Loan:
      type: object
      required: [id,book_id,member_name,loan_date,return_date]
      properties:
        id:
          type: integer
          example: 1
        
        book_id:
          type: integer
          example : 1
        member_name:
          type: string
          example : Alan
        loan_date:
          type: string
          example: 2021-06-06
        return_date:
          type : string || null
          example : 2021-06-06 || null

    NewLoan:
        type: object
        required: [book_id,member_name]
        properties:
          book_id:
            type: integer
            example: 1
          
          member_name:
            type: "string"
            example : Alan
    
    LoanReturn:
        type: string
        example:  2021-06-06


    
    NewBook:
      type: object
      required: [title,year,author_id]
      properties:
        title:
          type : string
          minimum: 1
          maximum: 200
          example : El Principito
        
        year:
            type : integer
            minimum: 1000
            maximum: 2100
            example : 2026
        
        author_id:
          type : integer
          example : 1

    UpdateBook:
        type: object
        required: [title,year,author_id]
        properties:
          title:
            type : string
            minimum: 1
            maximum: 200
            example : El Principito
          
          year:
              type : integer
              minimum: 1000
              maximum: 2100
              example : 2026
          
          author_id:
            type : integer
            example : 1
    
    BookPage:
        type: object
        required: [data,total,page,limit]
        properties:
          total:
            type: integer
          page:
            type: integer
            minimum: 1
            example: 1
          limit:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
          data:
            type: array
            items:
              type: object
              required: [id,title,year,author_id,available]
              properties:
                id:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: "Harry Potter y la piedra filosofal"
                year:
                  type: integer
                  example: 1997
                author_id:
                  type: integer
                  example: 1
                available:
                  type: boolean
                  example: false
    NewAuthor:
          type: object
          required: [name, nationality]
          properties:
            name:
              type: string
              example: Jorge Luis Borges
            nationality:
              type: string
              example: Argentinean

    NewUser:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        password:
          type: string
          format: password
          example: s3cretPass

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Usuario creado

    Token:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT con el payload `{ email, role }`. Se envía en el header `Authorization Bearer <token>`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ValidationError:
      type: object
      required: [status, code, message, errors]
      properties:
        status:
          type: string
          example: error
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Los datos enviados no son válidos.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: '"email" must be a valid email'

